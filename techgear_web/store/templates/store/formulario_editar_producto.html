
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechGear | Editar producto</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #101010;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            padding: 40px 20px;
        }

        .contenedor {
            max-width: 550px;
            margin: auto;
            background: #191919;
            border: 1px solid #333;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        h1 span {
            color: #2785ff;
        }

        .subtitulo {
            color: #aaa;
            margin-bottom: 25px;
        }

        .grupo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input:not([type="checkbox"]),
        textarea {
            width: 100%;
            padding: 12px;
            background: #101010;
            color: white;
            border: 1px solid #444;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .activo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .activo label {
            margin: 0;
        }

        .error {
            background: #351d1d;
            color: #ffaaaa;
            padding: 12px;
            margin-bottom: 20px;
        }

        .acciones {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .volver {
            padding: 12px 18px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }

        button {
            background: #2785ff;
            color: white;
        }

        .volver {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>Tech<span>Gear</span></h1>

        <p class="subtitulo">Editar producto del catálogo</p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% if producto %}

            <form method="POST">
                {% csrf_token %}

                <div class="grupo">
                    <label for="nombre">Nombre del producto</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        value="{{ producto.nombre }}"
                        minlength="2"
                        maxlength="120"
                        required
                    >
                </div>

                <div class="grupo">
                    <label for="descripcion">Descripción</label>
                    <textarea
                        id="descripcion"
                        name="descripcion"
                        maxlength="1000"
                    >{{ producto.descripcion|default:"" }}</textarea>
                </div>

                <div class="grupo">
                    <label for="precio">Precio</label>
                    <input
                        type="number"
                        id="precio"
                        name="precio"
                        value="{{ producto.precio }}"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="grupo">
                    <label for="stock">Cantidad en inventario</label>
                    <input
                        type="number"
                        id="stock"
                        name="stock"
                        value="{{ producto.stock }}"
                        min="0"
                        step="1"
                        required
                    >
                </div>

                <div class="grupo activo">
                    <input
                        type="checkbox"
                        id="activo"
                        name="activo"
                        {% if producto.activo %}checked{% endif %}
                    >
                    <label for="activo">Producto activo</label>
                </div>

                <div class="acciones">
                    <button type="submit">
                        Guardar cambios
                    </button>

                    <a
                        href="{% url 'dashboard_admin' %}"
                        class="volver"
                    >
                        Cancelar
                    </a>
                </div>

            </form>

        {% endif %}

    </main>

</body>
</html>
